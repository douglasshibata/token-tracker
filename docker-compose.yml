version: '3.8'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: token_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tracker:password@db:5432/token_tracker
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-gateway-default-secret-key-12345}
      - DEFAULT_PROJECT_ID=00000000-0000-0000-0000-000000000000
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  logq:
    build:
      context: ./logq
      dockerfile: Dockerfile
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
